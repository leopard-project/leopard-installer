# LeopardOS 安装选项 —— 所有安装步骤程序都会读这个文件（key=value）
#
# 不写任何东西 = 全交互（每一步都会问你）。
# 打开 auto=1 = 无人值守，步骤不再提问（适合脚本/批量测试）。
#
# auto=1
# disk=sata0
#
# 安装方案（profile）来自 /config/install-profiles.conf：
#   modern（默认）      ESP(FAT32) + ext4 root + ext4 /users
#   upstream            ESP(FAT32) + ext4 root（OpenXJ380 布局）
#   leopard-classic     3x FAT32（root/apps/users，旧方案）
#   custom              下面给每块分区写死
# profile=modern
# 旧键 scheme= 仍兼容；新配置优先使用 profile=
# scheme=modern
#
# custom 示例（第一个必须是 /，因为内核只认全局索引最低且带启动标记的分区）：
# profile=custom
# part.count=2
# part.0.mount=/
# part.0.size_mb=2048
# part.1.mount=/apps
# part.1.size_mb=4096
#
# boot.conf 里的 PID1 路径（缺省 /system/leopard/leopard-rc.elf）
# init=/system/leopard/leopard-rc.elf
#
# 树内内核模块（逗号/空格分隔；包由 ISO /media 提供，缺包只告警）
# 显式 modules= 覆盖 package-profiles.conf 里方案/组解析出的模块。
# modules=e1000-kmod,netserver-kmod,xhci-kmod
#
# 软件方案（package-profiles.conf 的 environment + groups 模型）：
#   minimal   仅核心系统
#   standard  核心 + 控制台工具 + 输入法（推荐，缺省）
#   full      核心 + 控制台工具 + 输入法 + 网络/USB 模块
#   custom    使用下面的 optional_packages= / modules=
# package_profile=standard
# 显式覆盖方案里的可选包/模块（仍与核心包去重后一起安装）
# optional_packages=leopard-utils,leopard-coreutils
#
# auto=1 时的收尾动作：reboot（缺省）或 shutdown
# （交互模式不读该项，装完会提示用户选择 1) 重启 / 2) 关机）
# finish=reboot
