# LeopardOS 安装序列 —— main.c（序列编排器）逐行执行
#
# 格式：每行一个步骤程序的**全路径**，无参数；# 开头为注释，空行忽略。
# 行序就是执行顺序。某一步返回非 0 时，编排器会问「重试 / 关机」；
# 全部步骤成功 → 编排器自己重启。
#
# 想改流程不用改代码：删掉/调换这里的行即可（比如调试时只留前 3 步）。

