# LeopardOS package selection — declarative environment + groups.
#
# The selection model follows mainstream distributions:
#   * core.packages   the mandatory base environment (always installed)
#   * group.<id>      optional package/module collections (like comps/tasksel)
#   * package.<id>    user-facing choices that aggregate groups (minimal/standard/full)
#
# All values are comma/space separated.  A group may contribute both packages
# and in-tree kernel modules; an unknown group name is warned about and skipped.
# Package lists are installed in one xbps transaction; modules in another.
#
# Explicit optional_packages= / modules= in /config/leopard-install.conf still
# override the resolved profile selection.  install-profiles.conf describes the
# disk layout only; this file is the single source of truth for software.

core.packages=OpenXSBoot,OpenXSKernel,leopard-base,leopard-rc,leopard-getty,leopard-conhost,leopard-doas,leopard-oobe,leopard-shell,leopard-mountd,xbps

# ---- optional groups ------------------------------------------------------
group.list=console,input,network,usb

group.console.title=Console tools
group.console.description=Core utilities, disk tools and shell commands
group.console.packages=leopard-utils,leopard-coreutils
group.console.modules=

group.input.title=Input and IME
group.input.description=Input method engine for keyboard and IME clients
group.input.packages=leopard-ime
group.input.modules=

group.network.title=Network drivers
group.network.description=Ethernet and network server kernel modules
group.network.packages=
group.network.modules=e1000-kmod,netserver-kmod

group.usb.title=USB support
group.usb.description=USB host controller kernel module
group.usb.packages=
group.usb.modules=xhci-kmod

# ---- user-facing package profiles ----------------------------------------
package.list=minimal,standard,full,custom

package.minimal.title=Minimal: core system only
package.minimal.description=Just the bootable base environment; no optional tools.
package.minimal.groups=
package.minimal.packages=
package.minimal.modules=

package.standard.title=Standard: console tools and IME (recommended)
package.standard.description=Core system plus console utilities and input method support.
package.standard.groups=console,input
package.standard.packages=
package.standard.modules=

package.full.title=Full: standard plus all kernel modules
package.full.description=Standard plus network and USB driver modules.
package.full.groups=console,input,network,usb
package.full.packages=
package.full.modules=

package.custom.title=Custom: explicit lists
package.custom.description=Use optional_packages= and modules= from install.conf.
package.custom.groups=
package.custom.packages=
package.custom.modules=
