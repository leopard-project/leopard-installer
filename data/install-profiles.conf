# LeopardOS install profiles.
# Format: name|label|size|fstype|mount|partition-type
# size: 64M, 30%, third, rest
profile.list=modern,upstream,leopard-classic,custom

profile.modern.title=Modern: ESP + ext4 root + ext4 /users
profile.modern.part.0=ESP|LP-ESP|64M|fatfs|/boot|ef00
profile.modern.part.1=root|LEOPARD|30%|ext4|/|8300
profile.modern.part.2=users|LP-USERS|rest|ext4|/users|8300
profile.modern.packages=leopard-utils,leopard-coreutils
profile.modern.modules=

profile.upstream.title=Upstream: ESP + ext4 root
profile.upstream.part.0=ESP|LP-ESP|64M|fatfs|/boot|ef00
profile.upstream.part.1=root|LEOPARD|rest|ext4|/|8300
profile.upstream.packages=leopard-utils,leopard-coreutils
profile.upstream.modules=

profile.leopard-classic.title=Classic: 3x FAT32 (root/apps/users)
profile.leopard-classic.part.0=ESP|LEOPARD|third|fatfs|/|ef00
profile.leopard-classic.part.1=apps|LP-APPS|third|fatfs|/apps|8300
profile.leopard-classic.part.2=users|LP-USERS|rest|fatfs|/users|8300
